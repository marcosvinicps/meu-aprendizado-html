<!doctype html>
<html>
	<head>
		<link rel="stylesheet" href="aulacss.css">
		<meta charset="utf-8">
		<title>Aprendizado</title>
	</head>
	<body>
		<h1 id="titulo01">Bem vindo a página!</h1>
			<p id="p1"> Estou aprendendo a linguagem HTML, CSS e JavaScript.</p>
	
		<fieldset>
		<legend>Fale Conosco</legend>
			<label for="nome">Nome: </label>
			<input type="text" name="nome" required>
			<br>
			<label for="email">Email: </label>
			<input type="email" name="email" required>
			<br>
			<label for="tel">Telefone: </label>
			<input type="tel" name="telefone" pattern="([0-9]{2})[0-9]{5}-[0-9]{3,4}$" title="Digite um telefone com DDD: 10 ou 11 números." required>
			<br>
			<label for="nascimento">Data de Nascimento: </label>
			<input type="date" name="nascimento" required>
			<br>
			<label for="mensagem">Mensagem: </label>
			<textarea name="mensagem" cols="30" rows="4"></textarea>
			<br>
			<input type="submit" value="Enviar">
		</fieldset>
		<footer>
			<a href="#">Voltar</a>
			<div class="gradient">
				<a href="https://www.linkedin.com/in/marcos-vinicius-7695a0176/">Clique para entrar em contato!</a>
			</div>
		</footer>
	</body>
</HTML>
